<!DOCTYPE html>
<html>
<head>
	<title>Ronaldo vs Messi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   
   <h1>Ronaldo vs Messi</h1>

<p>Compare two of football's greatest players.</p>

<div class="players">
<button id="compare-button">Compare Goals</button>

<p id="result"></p>
    <div class="player-card">
        <img src="images/ronaldo.jpg" alt="Ronaldo">

        <h2>Cristiano Ronaldo</h2>

        <p>Goals: <span id="ronaldo-goals">0</span></p>
        <p>Assists: <span id="ronaldo-assists">0</span></p>
        <p>Ballon d'Or: <span id="ronaldo-ballon">0</span></p>
    </div>

    <div class="player-card">
        <img src="images/messi.jpg" alt="Messi">

        <h2>Lionel Messi</h2>

        <p>Goals: <span id="messi-goals">0</span></p>
        <p>Assists: <span id="messi-assists">0</span></p>
        <p>Ballon d'Or: <span id="messi-ballon">0</span></p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
